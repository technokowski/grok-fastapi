<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Site{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <header class="top">
    <div class="nav-shell">
      <span class="who bar-who">{{ user.username }}</span>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" autocomplete="off">
      <label for="nav-toggle" class="nav-toggle-btn">
        <span class="nav-open">Menu</span>
        <span class="nav-close">Close</span>
      </label>
      <nav class="nav">
        {% for item in nav_items %}
        <a href="{{ item.path }}" {% if request.url.path == item.path %}class="current"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <span class="spacer"></span>
        <span class="who nav-who">{{ user.username }}</span>
        <a href="/change-password">Password</a>
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">
          <button type="submit">Sign out</button>
        </form>
      </nav>
    </div>
  </header>
  {% endif %}
  <main class="wrap">
    {% if flash %}
    <p class="flash {{ flash.kind }}">{{ flash.message }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
